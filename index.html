<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="KeCo Robotics — Undersea robotics. Something is coming." />
    <meta name="theme-color" content="#085041" />
    <title>KeCo Robotics</title>
    <link rel="icon" href="icon.png" type="image/png" />
    <link rel="apple-touch-icon" href="icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>

    <header class="nav-bar">
      <span class="brand">KeCo Robotics</span>
    </header>

    <main>
      <section class="hero" id="hero">
        <canvas class="hero__canvas" id="heroCanvas" aria-hidden="true"></canvas>
        <div class="hero__inner">
          <h1 class="hero__title">The Kelp and Coral Robot Company</h1>
          <form class="hero__form" id="notifyForm" novalidate>
            <input type="email" name="email" placeholder="your@email.com" autocomplete="email" required />
            <button type="submit" class="btn btn--coral">Stay informed</button>
          </form>
        </div>
      </section>
    </main>

    <footer class="footer">
      <div class="footer__inner">
        <span>© <span id="y"></span> The Kelp &amp; Coral Robot Company</span>
        <span class="footer__tag">FLOUNDER&#x2011;1  ·  STATUS: running</span>
      </div>
    </footer>

    <script src="script.js" defer></script>
  </body>
</html>
