<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>404 — Keco Robotics</title>
    <link rel="icon" href="icon.png" type="image/png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Nunito:wght@600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --foam: #e8f8fc;
        --sea: #2d7a8c;
        --ink: #1e3a45;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 2rem;
        background: linear-gradient(180deg, var(--foam), #b8e8f0);
        color: var(--ink);
        font-family: "Nunito", system-ui, sans-serif;
        text-align: center;
      }
      h1 {
        font-family: "Fredoka", sans-serif;
        color: var(--sea);
        margin: 0 0 0.5rem;
        font-size: clamp(2.5rem, 10vw, 4rem);
      }
      p {
        margin: 0;
        font-size: 1.05rem;
      }
      a {
        display: inline-block;
        margin-top: 1.5rem;
        font-family: "Fredoka", sans-serif;
        font-weight: 600;
        color: var(--sea);
        text-decoration: none;
      }
      a:hover {
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <div>
      <h1>Oops — wrong tide pool</h1>
      <p>This page swam away. (404)</p>
