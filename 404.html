<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>404 — Keco Robotics</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=Orbitron:wght@700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #05080c;
        --accent: #3ee4d0;
        --dim: #7a8f8b;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 2rem;
        background: var(--bg);
        color: var(--dim);
        font-family: "IBM Plex Mono", monospace;
        text-align: center;
      }
      h1 {
        font-family: Orbitron, sans-serif;
        color: var(--accent);
        letter-spacing: 0.2em;
        margin: 0 0 0.5rem;
        font-size: clamp(3rem, 12vw, 5rem);
      }
      p {
        margin: 0;
        letter-spacing: 0.08em;
        font-size: 0.85rem;
      }
      a {
        color: var(--accent);
        margin-top: 2rem;
        display: inline-block;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        font-size: 0.72rem;
      }
    </style>
  </head>
  <body>
    <div>
      <h1>404</h1>
      <p>ROUTE CLASSIFIED · OR REMOVED</p>
      <p><a href="index.html">RETURN TO OPS</a></p>
    </div>
  </body>
</html>
